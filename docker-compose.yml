services:
  api:
    build:
      context: ./GameBacklogApi
      dockerfile: Dockerfile
    container_name: gamebacklog_api
    ports:
      - "8080:8080"
    volumes:
      - ./GameBacklogApi/data:/app/data
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Frontend__Url: http://localhost:5173
      Steam__ApiKey: ${STEAM_API_KEY:-}
  
  frontend:
    build:
      context: ./gamebacklog-ui
      dockerfile: Dockerfile.dev
    container_name: gamebacklog_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./gamebacklog-ui:/app
      - ui_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8080
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api
    
volumes:
  ui_node_modules:
    